<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Libros</title>
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="firebase.js"></script>
</head>
<body>

<nav class="nav">
  <a href="index.html">Inicio</a>
  <a href="libros.html">Libros</a>
  <a href="usuarios.html">Usuarios</a>
  <a href="devolver.html">Devolver</a>
  <a href="editarLibros.html" class="active">Editar Libros</a>
  <a href="editarUsuarios.html">Editar Usuarios</a>
</nav>

<div class="container">
  <h1>Editar Libros</h1>
  <div class="table-wrap">
    <table id="tabla">
      <thead>
        <tr>
          <th>Título</th>
          <th>Autor</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="msgEditar" class="msg"></div>
</div>

<script type="module">
  import { db, ref, get, update, remove, onValue } from "./firebase.js";

  const body = document.querySelector("#tabla tbody");
  const msg = document.getElementById("msgEditar");

  onValue(ref(db, "libros"), render);

  function render() {
    get(ref(db, "libros")).then(snap => {
      body.innerHTML = "";
      if (!snap.exists()) return;
      Object.entries(snap.val()).forEach(([id, libro]) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${libro.titulo}</td>
          <td>${libro.autor}</td>
          <td>${libro.disponible ? "Disponible" : "Prestado"}</td>
          <td>
            <button class="btn btn-sm" data-edit="${id}">Editar</button>
            <button class="btn btn-sm btn-danger" data-del="${id}">Eliminar</button>
          </td>
        `;
        body.appendChild(tr);
      });
      attachHandlers();
    });
  }

  function attachHandlers() {
    body.querySelectorAll("[data-edit]").forEach(b => {
      b.addEventListener("click", async () => {
        const id = b.getAttribute("data-edit");
        const nuevoTitulo = prompt("Nuevo título:");
        if (!nuevoTitulo?.trim()) return;
        try {
          await update(ref(db, "libros/" + id), { titulo: nuevoTitulo.trim() });
          showMsg("Libro actualizado.", "ok");
        } catch (err) {
          console.error(err);
          showMsg("Error al actualizar libro.", "error");
        }
      });
    });
    body.querySelectorAll("[data-del]").forEach(b => {
      b.addEventListener("click", async () => {
        const id = b.getAttribute("data-del");
        if (!confirm("¿Eliminar libro?")) return;
        try {
          await remove(ref(db, "libros/" + id));
          showMsg("Libro eliminado.", "ok");
        } catch (err) {
          console.error(err);
          showMsg("Error al eliminar libro.", "error");
        }
      });
    });
  }

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = `msg ${type}`;
    setTimeout(() => { msg.textContent = ""; msg.className = "msg"; }, 2500);
  }
</script>

</body>
</html>
