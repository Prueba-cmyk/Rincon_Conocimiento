<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Libros</title>
  <link rel="stylesheet" href="estilo.css">
  <script type="module" src="firebase.js"></script>
</head>
<body>

<nav class="nav">
  <a href="index.html">Inicio</a>
  <a href="libros.html" class="active">Libros</a>
  <a href="usuarios.html">Usuarios</a>
  <a href="devolver.html">Devolver</a>
  <a href="editarlibros.html">Editar Libros</a>
  <a href="editarusuarios.html">Editar Usuarios</a>
</nav>

<div class="container">
  <h1>Gestión de Libros</h1>

  <form id="formLibro" class="form" novalidate>
    <label for="titulo">Título</label>
    <input id="titulo" type="text" required aria-required="true" placeholder="Ej: Programación I">
    <label for="autor">Autor</label>
    <input id="autor" type="text" required aria-required="true" placeholder="Ej: Ada Lovelace">
    <button id="btnAgregarLibro" type="submit" class="btn">Agregar Libro</button>
    <div id="msgLibro" class="msg"></div>
  </form>

  <label for="buscador">Buscar libro</label>
  <input id="buscador" type="text" placeholder="Buscar por título o autor" aria-label="Buscar libros">

  <div class="table-wrap">
    <table id="tablaLibros">
      <thead>
        <tr>
          <th>Título</th>
          <th>Autor</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { db, ref, push, set, get, onValue } from "./firebase.js";

  const form = document.getElementById("formLibro");
  const msg = document.getElementById("msgLibro");
  const tablaBody = document.querySelector("#tablaLibros tbody");
  const buscador = document.getElementById("buscador");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const titulo = document.getElementById("titulo").value.trim();
    const autor = document.getElementById("autor").value.trim();
    if (!titulo || !autor) {
      showMsg("Completa título y autor.", "error");
      return;
    }
    form.querySelector("button").disabled = true;
    try {
      const snap = await get(ref(db, "libros"));
      const exists = snap.exists() && Object.values(snap.val()).some(l =>
        l.titulo.toLowerCase() === titulo.toLowerCase() &&
        l.autor.toLowerCase() === autor.toLowerCase()
      );
      if (exists) {
        showMsg("Ese libro ya existe.", "warn");
      } else {
        const libroRef = push(ref(db, "libros"));
        await set(libroRef, { titulo, autor, disponible: true, prestadoA: null });
        form.reset();
        showMsg("Libro agregado.", "ok");
      }
    } catch (err) {
      showMsg("Error al agregar libro.", "error");
      console.error(err);
    } finally {
      form.querySelector("button").disabled = false;
    }
  });

  let debounceId;
  buscador.addEventListener("input", () => {
    clearTimeout(debounceId);
    debounceId = setTimeout(render, 200);
  });

  onValue(ref(db, "libros"), render);

  function render() {
    const filtro = buscador.value.trim().toLowerCase();
    get(ref(db, "libros")).then(snap => {
      tablaBody.innerHTML = "";
      if (!snap.exists()) return;
      Object.values(snap.val())
        .filter(l => !filtro || l.titulo.toLowerCase().includes(filtro) || l.autor.toLowerCase().includes(filtro))
        .forEach(l => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${l.titulo}</td>
            <td>${l.autor}</td>
            <td>${l.disponible ? "Disponible" : "Prestado"}</td>
          `;
          tablaBody.appendChild(tr);
        });
    });
  }

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = `msg ${type}`;
    setTimeout(() => { msg.textContent = ""; msg.className = "msg"; }, 2500);
  }
</script>

</body>

</html>
